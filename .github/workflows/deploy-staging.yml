name: Deploy → Staging (AWS EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy: a branch, a tag or a full commit SHA (default: the commit this workflow runs on)'
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # One commit for the whole run: CI is checked on it, deploy.sh deploys it, and it is recorded on it.
  resolve:
    name: Resolve the commit to deploy
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait-for-ci:
    name: Wait for CI to pass on that commit
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 90
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          check-name: 'API — typecheck, lint, test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  deploy:
    name: Build + restart staging container on EC2
    runs-on: ubuntu-latest
    needs: [resolve, wait-for-ci]
    timeout-minutes: 60   # t3.micro builds are slow; allow plenty
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy script on EC2
        run: |
          SHA="${{ needs.resolve.outputs.sha }}"
          ssh -i ~/.ssh/ec2.pem \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "sudo bash /srv/smartfleet/src/infrastructure/aws/deploy.sh staging '$SHA'"

      # promote-prod accepts only a commit that carries this status.
      - name: Record the staging deploy on the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -f state=success -f context=deploy/staging -f description="Deployed to staging and healthy" >/dev/null

  smoke:
    name: Smoke tests against staging
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    if: vars.STAGING_API_URL != ''
    env:
      API_BASE_URL: ${{ vars.STAGING_API_URL }}/api/v1
      # The commit GET /health must report, and the website origin a CORS preflight must be allowed from.
      EXPECTED_VERSION: ${{ needs.resolve.outputs.sha }}
      WEBSITE_ORIGIN: ${{ vars.STAGING_WEBSITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run smoke suite
        working-directory: apps/api
        run: npm test -- test/smoke --passWithNoTests
