name: Deploy → Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'API — typecheck, lint, test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  trigger-railway:
    name: Trigger Railway staging deploy
    runs-on: ubuntu-latest
    needs: wait-for-ci
    steps:
      # Railway auto-deploys "staging" environment from main on push by default.
      # This step exists so we can post-deploy verify. If you wired the staging
      # env to manual deploys, uncomment the curl below to trigger via API.
      #
      # - name: Kick Railway deploy
      #   run: |
      #     curl -fsSL -X POST \
      #       -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{"serviceId":"${{ secrets.RAILWAY_STAGING_SERVICE_ID }}","environmentId":"${{ secrets.RAILWAY_STAGING_ENV_ID }}"}' \
      #       https://backboard.railway.app/graphql/v2
      - name: Wait for staging to come up
        run: |
          for i in {1..40}; do
            if curl -fsSL "${{ vars.STAGING_API_URL }}/api/v1/health/live" >/dev/null; then
              echo "staging live"; exit 0
            fi
            sleep 15
          done
          echo "staging did not come up"; exit 1

  smoke:
    name: Smoke tests against staging
    runs-on: ubuntu-latest
    needs: trigger-railway
    env:
      API_BASE_URL: ${{ vars.STAGING_API_URL }}/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run smoke suite
        working-directory: apps/api
        run: npm test -- test/smoke --passWithNoTests
