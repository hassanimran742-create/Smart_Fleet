name: CI

on:
  pull_request:
    branches: [main]
  # Every pushed branch, so any commit can be deployed to staging behind its own green check
  # (deploy-staging and promote-prod wait for this job on the exact commit they deploy).
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: smartfleet
          POSTGRES_PASSWORD: smartfleet_dev
          POSTGRES_DB: smartfleet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartfleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smartfleet:smartfleet_dev@localhost:5432/smartfleet_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_access_secret_change_me_change_me_xx
      JWT_REFRESH_SECRET: ci_refresh_secret_change_me_change_me_x
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BLIND_INDEX_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      BULLMQ_PREFIX: sf-ci-test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The API resolves @smartfleet/* through each package's dist (gitignored), for tsc and ts-jest alike.
      - name: Build shared packages
        run: npm run build -w @smartfleet/shared-types -w @smartfleet/shared-utils -w @smartfleet/shared-validation
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - name: Apply migrations to a fresh test DB
        working-directory: apps/api
        run: npx prisma migrate deploy
      # Applies every migration to an empty shadow database and diffs it against schema.prisma.
      # The schema must be the FROM side: with --from-migrations, Prisma 5.22 ignores the
      # postgresqlExtensions preview feature on the shadow side and reports the three
      # extensions as missing, so the check would always fail.
      - name: Migrations match schema.prisma
        working-directory: apps/api
        run: |
          PGPASSWORD=smartfleet_dev psql -h localhost -U smartfleet -d postgres -c 'CREATE DATABASE smartfleet_shadow'
          npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-migrations prisma/migrations \
            --shadow-database-url postgresql://smartfleet:smartfleet_dev@localhost:5432/smartfleet_shadow --exit-code
      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck
      - name: Lint
        working-directory: apps/api
        run: npm run lint -- --max-warnings=0 || true   # warn-only until baseline lint passes
      - name: Unit tests
        working-directory: apps/api
        run: npm test -- --passWithNoTests
      - name: DB tests (PostGIS and Redis services)
        working-directory: apps/api
        run: npm run test:e2e -- --passWithNoTests

  admin-web:
    name: Admin web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: apps/admin-web
        run: npx tsc --noEmit
      - working-directory: apps/admin-web
        run: npm run build

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: apps/mobile
        run: npx tsc --noEmit
